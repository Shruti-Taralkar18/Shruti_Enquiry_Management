<div class="container-fluid py-4 parent">

  <!-- Header -->
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3 class="m-0">Track Enquiry</h3>
  </div>

  <!-- SEARCH CARD -->
  <div class="card card-section">
    <div class="card-body">
      <h5 class="card-title"> Search Enquiry</h5>

      <div class="row g-3 align-items-end">
        <div class="col-md-8">
          <label class="form-label">Phone Number or Email</label>
          <div class="input-group">
            <span class="input-group-text">
              <i class="bi bi-search"></i>
            </span>
            <input
              type="text"
              class="form-control"
              placeholder="Enter phone number or email"
            />
          </div>
        </div>

        <div class="col-md-4 text-md-end">
          <button class="btn btn-primary px-4">
            Track Enquiry
          </button>
        </div>
      </div>
    </div>
  </div>

<div class="row justify-content-center">
  <div class="col-lg-8 col-md-10">

    <div class="card card-section result-card mt-4">
      <div class="card-body">

        <div class="d-flex justify-content-between align-items-center mb-3">
          <h5 class="card-title mb-0">Enquiry Details</h5>

          <!-- STATUS BADGE -->
          <span class="status-chip pending">
            Pending
          </span>
        </div>

        <div class="row g-3">

          <div class="col-md-6">
            <label class="form-label">Customer Name</label>
            <div class="readonly-box">John Doe</div>
          </div>

          <div class="col-md-6">
            <label class="form-label">Phone</label>
            <div class="readonly-box">9876543210</div>
          </div>

          <div class="col-md-6">
            <label class="form-label">Email</label>
            <div class="readonly-box">john@gmail.com</div>
          </div>

          <div class="col-md-6">
            <label class="form-label">Enquiry Date</label>
            <div class="readonly-box">12 Jan 2026 • 10:45 AM</div>
          </div>

          <div class="col-12">
            <label class="form-label">Message</label>
            <div class="message-box">
              I am interested in your services. Please contact me.
            </div>
          </div>

        </div>

      </div>
    </div>

  </div>
</div>


  <footer class="text-muted end-footer small text-center">
    Enquiry Management System
  </footer>

</div>
