<div class="login-color">
  <div class="d-flex align-items-center justify-content-center">
    <div class="card shadow-lg rounded-4 login-card">
      <div class="card-body p-4 p-md-5">

        <div class="text-center mb-4">
          <h4 class="mb-0">Welcome</h4>
          <p class="text-muted">Sign in to continue to your account</p>
        </div>
        <form [formGroup]="loginForm" (ngSubmit)="onLogin()" novalidate>

          <div class="mb-3 form-floating">
            <input
              type="email"
              id="email"
              class="form-control form-control-lg input-anim"
              placeholder="name@example.com"
              formControlName="email"
              [class.is-invalid]="(email.touched || submitted) && email.invalid">

            <label for="email">Email address</label>

            <div class="invalid-feedback d-block"
                 *ngIf="(email.touched || submitted) && email.invalid">
              <div *ngIf="email.errors?.['required']">Email is required</div>
              <div *ngIf="email.errors?.['email']">Enter a valid email</div>
            </div>
          </div>

          <!-- Password -->
          <div class="mb-3 form-floating">
            <input
              type="password"
              id="password"
              class="form-control form-control-lg input-anim"
              placeholder="Password"
              formControlName="password"
              [class.is-invalid]="(password.touched || submitted) && password.invalid">

            <label for="password">Password</label>

            <div class="invalid-feedback d-block"
                 *ngIf="(password.touched || submitted) && password.invalid">
              <div *ngIf="password.errors?.['required']">Password is required</div>
              <div *ngIf="password.errors?.['minlength']">
                Minimum 8 characters required
              </div>
              <div *ngIf="password.errors?.['pattern']">
                Must contain 1 capital letter, 1 digit and 1 special character
              </div>
            </div>
          </div>

          <div class="d-flex justify-content-between align-items-center mb-3">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="remember">
              <label class="form-check-label small text-muted" for="remember">
                Remember me
              </label>
            </div>
            <a href="#">Forgot?</a>
          </div>

          <button
            type="submit"
            class="btn btn-primary btn-lg w-100 mb-3 btn-anim"
            [disabled]="loginForm.invalid">
            Sign in
          </button>

          <div class="text-center">
            <p class="text-muted m-0">Don't have an account?</p>
            <div class="mt-2">
              <a href="#" class="fw-medium">Sign up</a>
            </div>
          </div>

        </form>

      </div>
    </div>
  </div>
</div>
